[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "radar-empleo-google-ads"
version = "0.1.0"
description = "Bot que detecta ofertas junior de Google Ads/SEM en el mercado hispanohablante y las envía a Telegram"
readme = "README.md"
license = "MIT"
authors = [{ name = "Tuimagen Studios" }]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",  # zonas horarias en Windows
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
