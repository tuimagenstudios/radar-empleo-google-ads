name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Pruebas (pytest)
        run: pytest -q --cov=radar --cov-report=term-missing
      - name: Ensayo con la muestra (dry-run)
        run: python -m radar --dry-run
