name: Radar

# Dos ejecuciones diarias (RF-EJE-03). Horas en UTC:
#   06:00 UTC = 09:00 en Moscú → resumen del día, siempre se envía.
#   18:00 UTC = 21:00 en Moscú → silenciosa: solo escribe si hay ofertas nuevas o errores.
on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write  # para guardar la base en la rama "datos"

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar
        run: pip install -e .

      - name: Traer la base de la rama datos
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin datos >/dev/null; then
            git fetch --depth=1 origin datos
            git show origin/datos:radar.sqlite > data/radar.sqlite
            echo "Base recuperada"
          else
            echo "Primera ejecución: base nueva"
          fi

      - name: Ejecutar el radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 18 * * *" ]; then
            python -m radar --silencioso
          else
            python -m radar
          fi

      - name: Guardar la base en la rama datos
        if: always() && hashFiles('data/radar.sqlite') != ''
        run: |
          # Rama huérfana con un solo commit: guarda el estado sin hacer crecer el historial.
          tmp="$(mktemp -d)"
          cp data/radar.sqlite "$tmp/"
          cd "$tmp"
          git init -q -b datos
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar.sqlite
          git commit -qm "datos: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos
