# Radar de Empleo Junior en Google Ads — configuración
# Todo el perfil de búsqueda vive acá (RF-CFG-01). Los secretos NO: van en .env o en GitHub Secrets.

perfil:
  pais_base: AR               # ciudadanía, residencia legal y cuenta bancaria (RF-CFG-03)
  experiencia_max_anios: 2    # hasta cuántos años de experiencia mínima se aceptan
  zona_horaria: Europe/Moscow # dónde está físicamente el usuario (RF-EJE-06)

# Mercados objetivo: países hispanohablantes excepto Estados Unidos y Puerto Rico (RF-CFG-02)
# Desde el 5/11/2026: solo Argentina. Igual entran las ofertas remotas abiertas a
# Argentina (LATAM o cualquier país). Para volver a todo el mercado hispanohablante:
# [AR, BO, CL, CO, CR, CU, DO, EC, ES, GQ, GT, HN, MX, NI, PA, PE, PY, SV, UY, VE]
mercados: [AR]

terminos:
  # Requisito para 🟢 (RF-CLA-02)
  especialidad_fuerte:
    - google ads
    - adwords
    - sem
    - ppc
    - paid search
    - busqueda pagada
    - trafficker digital
    - trafficker
  # Solo cuentan si la oferta también menciona búsqueda o Google (RF-CLA-04)
  especialidad_debil:
    - paid media
    - medios pagos
    - performance
    - pauta digital
    - publicidad digital
  menciona_busqueda:
    - google
    - busqueda
    - search
  nivel_inicial:
    - junior
    - jr
    - trainee
    - pasante
    - pasantia
    - practicas
    - practicante
    - asistente
    - sin experiencia
    - primer empleo
  experiencia_afin:
    - campanas
    - palabras clave
    - keywords
    - conversiones
    - pujas
    - ga4
    - google analytics
    - merchant center
    - optimizacion
    - google tag manager
  descarte:
    - senior
    - sr
    - semi senior
    - ssr
    - lead
    - head
    - director
    - directora
    - gerente
    - responsable de equipo
    - lider de equipo
    - po
    - product owner
    - jefe
    - jefa
  # Se buscan en la descripción: frases que solo aparecen en puestos de conducción.
  descarte_descripcion:
    - experiencia liderando
    - liderando equipo
    - liderando equipos
    - liderar un equipo
    - liderar al equipo
    - personas a cargo
    - equipo a cargo

fuentes:
  # Get on Board: API pública sin cuenta. Funciona desde cualquier país.
  - tipo: getonbrd
    nombre: getonbrd
    # "sem" no se usa: el buscador la confunde con "Semi Senior".
    consultas: [google ads, ppc, trafficker, paid media, performance marketing,
                marketing digital]
    dias_max: 30     # ignora ofertas publicadas hace más de 30 días
    paginas_max: 2   # por consulta (50 ofertas por página)
    activa: true
  # Himalayas: API pública sin cuenta. Solo pide ofertas remotas que se pueden
  # tomar desde el país base (perfil.pais_base).
  - tipo: himalayas
    nombre: himalayas
    # Las consultas van por orden de importancia: si Himalayas corta por límite
    # de pedidos, se conserva lo leído hasta ese momento.
    consultas: [google ads, ppc, paid media]
    dias_max: 30
    paginas_max: 1   # por consulta (20 ofertas por página)
    activa: true
  # Jobicy: API pública sin cuenta. Pide pocas consultas por día:
  # cada corrida gasta regiones × consultas = 4.
  - tipo: jobicy
    nombre: jobicy
    regiones: [latam, argentina]
    consultas: [google ads, ppc]
    dias_max: 30
    activa: true
  # Remotive: API pública sin cuenta. Máximo ~4 consultas por día:
  # con 2 consultas y 2 corridas diarias queda justo en el límite.
  - tipo: remotive
    nombre: remotive
    consultas: [google ads, ppc]
    dias_max: 30
    activa: true
  # Alertas por correo de portales argentinos, leídas de Gmail en modo solo lectura.
  # Se activa sola cuando existen GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET y
  # GMAIL_REFRESH_TOKEN (ver docs/guia-gmail.md).
  - tipo: gmail
    nombre: alertas
    remitentes: [bumeran.com, bumeran.com.ar, zonajobs.com.ar, computrabajo.com, indeed.com,
                 workana.com]
    dias: 3          # lee las alertas de los últimos 3 días
    activa: true
  # Adzuna: API oficial (España y México). La cuenta gratuita trae solo 25
  # consultas de prueba; el uso continuo cuesta £8/mes. Queda APAGADA en la
  # ejecución programada hasta decidir si vale la pena (cada corrida gasta
  # paises × consultas = 4 consultas).
  - tipo: adzuna
    nombre: adzuna
    paises: [es, mx]
    consultas: [google ads, trafficker]
    dias_max: 30
    activa: false
  # Ofertas ficticias para probar el circuito (las pruebas automáticas usan esta).
  - tipo: muestra
    nombre: muestra
    ruta: data/muestra_ofertas.json
    activa: false

base_de_datos: data/radar.sqlite
